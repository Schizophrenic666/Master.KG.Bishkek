<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МастерКг</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:#fff;
}

h1{text-align:center;margin:20px}

.btn-wrap{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:12px 14px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

.call{background:#2196F3}
.wa{background:#25D366}
.tg{background:#0088cc}

.container{
  max-width:600px;
  margin:20px auto;
}

.form{
  background:#161616;
  padding:20px;
  border-radius:10px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:6px;
  border:none;
}

.hidden{display:none}

button{
  width:100%;
  padding:14px;
  background:#d4af37;
  border:none;
  font-weight:bold;
}

.msg{text-align:center;margin-top:10px}
.error{color:#ff5252}
.success{color:#00e676}
</style>
</head>

<body>

<h1>МастерКг</h1>

<div class="btn-wrap">
  <a class="btn call" href="tel:+996220705709">📞 Позвонить</a>
  <a class="btn wa" href="https://wa.me/996220705709">💬 WhatsApp</a>
  <a class="btn tg" href="https://t.me/GG_BRO_GGG">✈ Telegram</a>
</div>

<div class="container">

<div class="form">

<input id="name" placeholder="Имя">
<input id="phone" placeholder="Телефон (10 цифр)">
<select id="service" onchange="toggleOther()">
  <option value="">Услуга</option>
  <option>Ремонт</option>
  <option>Электрика</option>
  <option>Сантехника</option>
  <option value="other">Другое</option>
</select>

<input id="other" class="hidden" placeholder="Введите услугу">
<textarea id="message" placeholder="Описание"></textarea>
<input type="file" id="photo">

<button onclick="send()">Отправить</button>
<div id="msg" class="msg"></div>

</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbygcyQgIkKwLuoyDsk84OAhykNNi1kRCmc5l_wIHbARBbdYtDTLHIV61Roi5DO-94uJ/exec";

/* телефон */
document.getElementById("phone").addEventListener("input", function(){
  this.value=this.value.replace(/\D/g,'').slice(0,10);
});

/* другое */
function toggleOther(){
  const s=document.getElementById("service");
  document.getElementById("other").classList.toggle("hidden", s.value!=="other");
}

/* base64 */
function toBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.readAsDataURL(file);
    r.onload=()=>res(r.result);
    r.onerror=e=>rej(e);
  });
}

function show(t,c){
  const m=document.getElementById("msg");
  m.textContent=t;
  m.className="msg "+c;
}

async function send(){

  const name=nameInput.value.trim();
  const phone=phoneInput.value.trim();
  const service=serviceInput.value;
  const other=otherInput.value.trim();
  const message=messageInput.value.trim();
  const file=document.getElementById("photo").files[0];

  if(!name || phone.length!==10 || !service){
    show("❌ Заполните форму","error");
    return;
  }

  let finalService = service==="other" ? other : service;

  let photoBase64="";
  if(file){
    photoBase64=await toBase64(file);
  }

  show("⏳ Отправка...","");

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      name,
      phone,
      service:finalService,
      message,
      photo:photoBase64
    })
  });

  show("✔ Отправлено","success");

  document.querySelectorAll("input,textarea").forEach(e=>e.value="");
}
</script>

</body>
</html>
